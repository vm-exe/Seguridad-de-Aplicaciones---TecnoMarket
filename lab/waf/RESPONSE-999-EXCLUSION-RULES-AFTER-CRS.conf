# TecnoMarket GT - exclusiones de falsos positivos, evaluadas después de OWASP CRS.
#
# Procedimiento (documentarlo en el Anexo H):
#   1. Ejecutar la ronda 1 con MODSEC_RULE_ENGINE=DetectionOnly.
#   2. Navegar la tienda completa: catálogo, carrito, pago y panel de administración.
#   3. Listar las reglas que el tráfico legítimo activó:
#        docker compose logs waf | grep -o '"ruleId":"[0-9]*"' | sort | uniq -c
#   4. Añadir aquí una exclusión por cada falso positivo confirmado, con su
#      justificación. Ejemplo (NO activar sin haberlo observado):
#
#   SecRuleUpdateTargetById 942100 "!ARGS:post_content"
#
# Una exclusión sin evidencia que la respalde debilita el WAF.
