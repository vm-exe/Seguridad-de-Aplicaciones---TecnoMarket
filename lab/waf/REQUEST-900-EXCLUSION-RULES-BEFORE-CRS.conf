# TecnoMarket GT - reglas propias que se evalúan antes de OWASP CRS.
# Solo bloquean cuando MODSEC_RULE_ENGINE=On (ronda 2). En DetectionOnly quedan
# registradas en el log de auditoría, que es la evidencia de la ronda 1.

# R16 - XML-RPC: la tienda no usa clientes XML-RPC. Se evita el riesgo.
SecRule REQUEST_FILENAME "@endsWith /xmlrpc.php" \
    "id:100001,phase:1,deny,status:403,log,\
    msg:'TecnoMarket: acceso a XML-RPC bloqueado (R16)',tag:'tecnomarket'"

# R01 - Enumeración de usuarios por la API REST sin sesión de WordPress.
# Caso 1: la petición no trae ninguna cookie.
SecRule REQUEST_URI|ARGS_GET:rest_route "@rx /wp/v2/users" \
    "id:100002,phase:1,deny,status:403,log,chain,\
    msg:'TecnoMarket: enumeracion de usuarios por REST sin cookies (R01)',tag:'tecnomarket'"
    SecRule &REQUEST_HEADERS:Cookie "@eq 0"

# Caso 2: trae cookies, pero ninguna de sesión de WordPress.
SecRule REQUEST_URI|ARGS_GET:rest_route "@rx /wp/v2/users" \
    "id:100005,phase:1,deny,status:403,log,chain,\
    msg:'TecnoMarket: enumeracion de usuarios por REST sin sesion (R01)',tag:'tecnomarket'"
    SecRule REQUEST_HEADERS:Cookie "!@contains wordpress_logged_in_"

# R01 - Enumeración de usuarios por el parámetro author.
SecRule ARGS_GET:author "@rx ^[0-9]+$" \
    "id:100003,phase:1,deny,status:403,log,\
    msg:'TecnoMarket: enumeracion de usuarios por author (R01)',tag:'tecnomarket'"

# wp-cron no se invoca desde el exterior (ver README: DISABLE_WP_CRON).
SecRule REQUEST_FILENAME "@endsWith /wp-cron.php" \
    "id:100004,phase:1,deny,status:403,log,\
    msg:'TecnoMarket: wp-cron externo bloqueado',tag:'tecnomarket'"
