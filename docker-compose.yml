# =============================================================================
# Entorno contenerizado local (simula la arquitectura cloud):
#   Internet -> [waf: Nginx + ModSecurity + OWASP CRS] -> [app: Next.js] -> [db: MySQL 8.4]
# Sólo el WAF publica puertos. La red "backend" es interna (sin salida a Internet).
# Uso:
#   cp .env.docker.example .env.docker   (y completar valores)
#   docker compose up -d --build
#   docker compose --profile migrate run --rm migrate
# =============================================================================
name: ventas-online-segura

services:
  waf:
    # Imagen OWASP CRS + módulo OpenTelemetry de nginx (infra/waf/Dockerfile).
    build:
      context: infra/waf
    image: ventas-waf:local
    container_name: ventas-waf
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      BACKEND: http://app:3000
      PORT: "8080"
      SERVER_NAME: localhost
      SERVER_TOKENS: "off"
      PROXY_TIMEOUT: 60s
      MODSEC_RULE_ENGINE: "On"
      MODSEC_AUDIT_ENGINE: RelevantOnly
      MODSEC_AUDIT_LOG_FORMAT: JSON
      MODSEC_AUDIT_LOG: /dev/stdout
      MODSEC_REQ_BODY_LIMIT: "5242880"
      BLOCKING_PARANOIA: "2"
      DETECTION_PARANOIA: "2"
      ANOMALY_INBOUND: "5"
      ANOMALY_OUTBOUND: "4"
      ALLOWED_METHODS: "GET HEAD POST OPTIONS PUT PATCH DELETE"
      MAX_FILE_SIZE: "5242880"
      COMBINED_FILE_SIZES: "10485760"
      NGINX_ALWAYS_TLS_REDIRECT: "off" # en local sin TLS; en cloud TLS termina en el ALB
      SET_REAL_IP_FROM: 0.0.0.0/0
      OTEL_COLLECTOR_GRPC: otel-collector:4317
    volumes:
      - ./infra/waf/nginx/default.conf.template:/etc/nginx/templates/conf.d/default.conf.template:ro
      - ./infra/waf/nginx/limits.conf.template:/etc/nginx/templates/conf.d/limits.conf.template:ro
      - ./infra/waf/nginx/otel.conf.template:/etc/nginx/templates/conf.d/otel.conf.template:ro
      - ./infra/waf/modsecurity/REQUEST-900-EXCLUSION-RULES-BEFORE-CRS.conf:/etc/modsecurity.d/owasp-crs/rules/REQUEST-900-EXCLUSION-RULES-BEFORE-CRS.conf:ro
      - ./infra/waf/modsecurity/RESPONSE-999-EXCLUSION-RULES-AFTER-CRS.conf:/etc/modsecurity.d/owasp-crs/rules/RESPONSE-999-EXCLUSION-RULES-AFTER-CRS.conf:ro
    depends_on:
      app:
        condition: service_healthy
      otel-collector:
        condition: service_started
    # El healthcheck de la imagen consulta https://localhost:8443; aquí el WAF solo
    # escucha HTTP en 8080 (en la nube el TLS termina en el balanceador).
    healthcheck:
      test: ["CMD-SHELL", "curl -fs -A healthcheck http://localhost:8080/healthz || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 10s
    networks: [frontend, observabilidad]
    security_opt: ["no-new-privileges:true"]

  app:
    build:
      context: .
      target: runner
    image: ventas-online-segura:local
    container_name: ventas-app
    restart: unless-stopped
    env_file: .env.docker
    environment:
      NODE_ENV: production
      PORT: "3000"
      HOSTNAME: 0.0.0.0
      UPLOAD_DIR: /data/uploads
      TRUST_PROXY: "true"
      # Trazas OpenTelemetry (src/instrumentation.ts) hacia el Collector.
      OTEL_EXPORTER_OTLP_ENDPOINT: http://otel-collector:4318
      OTEL_EXPORTER_OTLP_PROTOCOL: http/protobuf
      OTEL_SERVICE_NAME: ventas-app
    read_only: true
    tmpfs:
      - /tmp:size=64m,noexec,nosuid
      - /app/.next/cache:size=128m,nosuid
    volumes:
      - uploads:/data/uploads
      # Buzón de laboratorio: con MAIL_CAPTURE_DIR=/data/correos los correos (activación,
      # recuperación) se guardan como JSON en ./reportes/correos en lugar de enviarse.
      - ./reportes/correos:/data/correos
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    pids_limit: 256
    mem_limit: 768m
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:3000/api/health"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s
    networks: [frontend, backend, observabilidad]
    # Sin "ports": la app NO es accesible directamente, sólo a través del WAF.

  migrate:
    build:
      context: .
      target: migrator
    image: ventas-online-segura-migrator:local
    profiles: ["migrate"]
    env_file: .env.docker
    # Usa MIGRATOR_DATABASE_URL (usuario con permisos DDL) sólo en este job
    read_only: true
    tmpfs: ["/tmp"]
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    depends_on:
      db:
        condition: service_healthy
    networks: [backend]

  # Tareas administrativas dentro de la red interna (la BD no se expone al host):
  #   docker compose --profile tareas run --rm tareas npx tsx --conditions=react-server scripts/seed.ts
  #   docker compose --profile tareas run --rm -e ADMIN_PASSWORD=... tareas npx tsx --conditions=react-server scripts/crear-admin.ts correo "Nombre"
  tareas:
    build:
      context: .
      target: tareas
    image: ventas-online-segura-tareas:local
    profiles: ["tareas"]
    env_file: .env.docker
    working_dir: /app
    volumes:
      - ./src:/app/src:ro
      - ./scripts:/app/scripts:ro
      - ./tsconfig.json:/app/tsconfig.json:ro
      - uploads:/data/uploads   # el seed guarda aquí las fotos del catálogo de ejemplo
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    depends_on:
      db:
        condition: service_healthy
    networks: [backend]

  db:
    image: mysql:8.4
    container_name: ventas-db
    restart: unless-stopped
    env_file: .env.docker
    command:
      - --require-secure-transport=OFF # en cloud (RDS) se exige TLS
      - --local-infile=0
      - --skip-name-resolve
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
    volumes:
      - dbdata:/var/lib/mysql
      - ./infra/db/init:/docker-entrypoint-initdb.d:ro
    cap_drop: [ALL]
    cap_add: [CHOWN, SETUID, SETGID, DAC_OVERRIDE]
    security_opt: ["no-new-privileges:true"]
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uroot -p\"$$MYSQL_ROOT_PASSWORD\" --silent"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks: [backend]
    # Sin "ports": la base de datos no se expone al host.

  # ---------------------------------------------------------------------------
  # Observabilidad (OpenTelemetry): WAF y app -> Collector (saneo) -> Jaeger.
  # Interfaz: http://localhost:16686 (solo en 127.0.0.1, nunca expuesta a la red).
  # ---------------------------------------------------------------------------
  otel-collector:
    image: otel/opentelemetry-collector-contrib:0.164.0@sha256:340c9ca6a36617084c6661bdc4f0fe92b7cda5a805d61673ec8db375fddc522b
    container_name: ventas-otel-collector
    restart: unless-stopped
    command: ["--config=/etc/otelcol/config.yaml"]
    volumes:
      - ./infra/observabilidad/otel-collector.yaml:/etc/otelcol/config.yaml:ro
    read_only: true
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    mem_limit: 256m
    depends_on: [jaeger]
    networks: [observabilidad]

  jaeger:
    image: jaegertracing/jaeger:2.22.0@sha256:836b967b5abcf1f7758066aa6b348619267a2f1459f72d472840570f9bd88a17
    container_name: ventas-jaeger
    restart: unless-stopped
    ports:
      - "127.0.0.1:16686:16686" # interfaz web, solo desde este equipo
    read_only: true
    tmpfs: ["/tmp"]
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    mem_limit: 512m
    networks: [observabilidad, monitoreo]

  # ---------------------------------------------------------------------------
  # Centro de pruebas de seguridad (perfil "monitor"; lo levanta «npm run laboratorio»).
  # http://127.0.0.1:4000 — el enlace con token aparece en los logs de ventas-monitor.
  #
  # RIESGO ACEPTADO DEL LABORATORIO: para lanzar Semgrep, Trivy, ZAP, etc., el panel necesita la
  # API de Docker, y quien crea contenedores con montajes controla el equipo. Mitigaciones:
  #   - el socket real solo lo monta docker-proxy, en solo lectura, y expone únicamente las rutas
  #     de la API necesarias (contenedores, imágenes, exec); swarm, secretos, plugins, build y
  #     system quedan bloqueados;
  #   - el panel no tiene comandos libres (solo IDs del catálogo), exige token y solo escucha en
  #     127.0.0.1 del equipo; no corre como root y no tiene capacidades de Linux.
  # En producción NUNCA se expone la API de Docker a una aplicación web.
  # ---------------------------------------------------------------------------
  docker-proxy:
    image: tecnativa/docker-socket-proxy:v0.5.0@sha256:1f5038b54f06c3e18422902cf00ba21803d1c97805aae032e5e6673d532d3459
    container_name: ventas-docker-proxy
    profiles: ["monitor"]
    restart: unless-stopped
    environment:
      CONTAINERS: "1"
      IMAGES: "1"
      EXEC: "1"
      INFO: "1"
      POST: "1"
      ALLOW_START: "1"
      ALLOW_STOP: "1"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    read_only: true
    tmpfs: ["/run", "/tmp"]
    security_opt: ["no-new-privileges:true"]
    networks: [docker-api]

  monitor:
    build:
      context: .
      dockerfile: monitor/Dockerfile
    image: ventas-monitor:local
    container_name: ventas-monitor
    profiles: ["monitor"]
    restart: unless-stopped
    ports:
      - "127.0.0.1:4000:4000"
    environment:
      MONITOR_HOST: 0.0.0.0
      DOCKER_HOST: tcp://docker-proxy:2375
      # Carpeta del proyecto vista desde el equipo (la define «npm run laboratorio»).
      PROYECTO_HOST: ${PROYECTO_HOST:-}
      MONITOR_USUARIO: ${MONITOR_USUARIO:-}
    volumes:
      - ./reportes:/proyecto/reportes            # historial, logs y reportes, visibles en el equipo
      - ./.env.docker:/proyecto/.env.docker:ro   # para ocultar los secretos en la salida
    shm_size: "512m" # Chromium (pruebas E2E)
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    depends_on: [docker-proxy]
    networks: [frontend, observabilidad, docker-api]

networks:
  frontend:
    driver: bridge
  backend:
    driver: bridge
    internal: true
  # Telemetría: interna, sin salida a Internet.
  observabilidad:
    driver: bridge
    internal: true
  # Solo para publicar la interfaz de Jaeger en 127.0.0.1 (una red interna no publica puertos).
  monitoreo:
    driver: bridge
  # API de Docker restringida (docker-proxy) para el panel y los análisis de Trivy.
  # No es interna: Trivy necesita descargar su base de vulnerabilidades.
  docker-api:
    driver: bridge

volumes:
  uploads:
  dbdata:
