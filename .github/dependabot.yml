# Dependabot con periodo de espera (cooldown): no propone versiones publicadas hace menos
# de 7 días, para dar tiempo a que la comunidad detecte paquetes comprometidos.
version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 10
    cooldown:
      default-days: 7
      semver-major-days: 14
  - package-ecosystem: docker
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
  - package-ecosystem: terraform
    directory: /infra/terraform/aws
    schedule:
      interval: monthly
    cooldown:
      default-days: 7
