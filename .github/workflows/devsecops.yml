# =============================================================================
# Pipeline DevSecOps - Ventas Online Segura
#   build-test -> sast / secrets / sca / iac / e2e -> container -> dast
# Fases del curso: 3 (SAST, SCA, codificación segura), 4 (DAST), 5 (contenedores, IaC)
#
# Cadena de suministro: cada acción está fijada por SHA de commit completo (40 caracteres)
# con la versión en un comentario; las imágenes de herramientas, por digest sha256.
# Dependabot (.github/dependabot.yml) propone las actualizaciones con 7 días de espera.
# =============================================================================
name: devsecops

on:
  push:
    branches: [main, proyecto]
  pull_request:
    branches: [main, proyecto]
  workflow_dispatch:
  schedule:
    - cron: "0 6 * * 1" # escaneo semanal (nuevos CVE en dependencias/imagen)

permissions:
  contents: read

concurrency:
  group: devsecops-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: "22"
  IMAGE_NAME: ventas-online-segura

jobs:
  # ---------------------------------------------------------------------------
  build-test:
    name: Build, lint, typecheck y pruebas
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    # Cifras para el job "resumen" (cada job publica las suyas, aunque falle).
    outputs:
      lint: ${{ steps.lint.outcome }}
      typecheck: ${{ steps.typecheck.outcome }}
      build: ${{ steps.build.outcome }}
      pruebas_ok: ${{ steps.metricas.outputs.pruebas_ok }}
      pruebas_total: ${{ steps.metricas.outputs.pruebas_total }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci --ignore-scripts
      - name: Lint
        id: lint
        run: npm run lint
      - name: Typecheck
        id: typecheck
        run: npx tsc --noEmit
      - name: Pruebas unitarias (Vitest)
        id: pruebas
        run: npx vitest run --reporter=default --reporter=json --outputFile=vitest-resultados.json
      - name: Build
        id: build
        run: npm run build
        env:
          NEXT_TELEMETRY_DISABLED: "1"
      - name: Métricas para el resumen
        id: metricas
        if: always()
        run: |
          echo "pruebas_ok=$(jq -r '.numPassedTests // "?"' vitest-resultados.json 2>/dev/null || echo '?')" >> "$GITHUB_OUTPUT"
          echo "pruebas_total=$(jq -r '.numTotalTests // "?"' vitest-resultados.json 2>/dev/null || echo '?')" >> "$GITHUB_OUTPUT"

  # ---------------------------------------------------------------------------
  sast:
    name: SAST (Semgrep)
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
      security-events: write
    container:
      image: semgrep/semgrep:1.140.0
    outputs:
      hallazgos: ${{ steps.metricas.outputs.hallazgos }}
      reglas: ${{ steps.metricas.outputs.reglas }}
      detalle: ${{ steps.metricas.outputs.detalle }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - name: Semgrep (OWASP Top 10 + reglas propias)
        run: |
          semgrep scan \
            --config p/owasp-top-ten \
            --config p/typescript \
            --config p/react \
            --config p/nextjs \
            --config p/secrets \
            --config security/semgrep/ \
            --exclude node_modules --exclude .next \
            --sarif --output semgrep.sarif \
            --error --severity ERROR
      - name: Publicar SARIF
        if: always()
        uses: github/codeql-action/upload-sarif@9418214df1f2c4b8128c770156c409013b07d6b9 # v3.39.3
        with:
          sarif_file: semgrep.sarif
          category: semgrep
      - name: Métricas para el resumen
        id: metricas
        if: always()
        shell: python3 {0}
        run: |
          import json, os
          salida = open(os.environ["GITHUB_OUTPUT"], "a")
          try:
              runs = json.load(open("semgrep.sarif")).get("runs", [])
              resultados = [r for run in runs for r in run.get("results", [])]
              reglas = sum(len(run["tool"]["driver"].get("rules", [])) for run in runs)
              # Hasta 3 hallazgos: regla y archivo:línea (sin el contenido del código).
              detalle = "; ".join(
                  f'{r["ruleId"].split(".")[-1]} en {r["locations"][0]["physicalLocation"]["artifactLocation"]["uri"]}:{r["locations"][0]["physicalLocation"]["region"]["startLine"]}'
                  for r in resultados[:3])
              print(f"hallazgos={len(resultados)}", file=salida)
              print(f"reglas={reglas}", file=salida)
              print(f"detalle={detalle}", file=salida)
          except Exception:
              print("hallazgos=?", file=salida)
              print("reglas=?", file=salida)

  # ---------------------------------------------------------------------------
  secrets:
    name: Detección de secretos (Gitleaks)
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    outputs:
      hallazgos: ${{ steps.metricas.outputs.hallazgos }}
      commits: ${{ steps.metricas.outputs.commits }}
      reglas: ${{ steps.metricas.outputs.reglas }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Gitleaks
        run: |
          docker run --rm -v "$PWD:/repo" zricethezav/gitleaks:v8.28.0@sha256:bf00b5e039f0fad4b32935dc5ec1e358f227ccd097bcb64b971f0331072fe2ae \
            detect --source /repo --redact --verbose --exit-code 1 \
            --report-format json --report-path /repo/gitleaks.json 2>&1 | tee gitleaks.log
      - name: Métricas para el resumen
        id: metricas
        if: always()
        run: |
          {
            echo "hallazgos=$(jq 'length' gitleaks.json 2>/dev/null || echo '?')"
            echo "commits=$(grep -oE '[0-9]+ commits? scanned' gitleaks.log | grep -oE '^[0-9]+' || echo '?')"
            # Excepciones documentadas en .gitleaks.toml (allowlists justificadas).
            echo "reglas=$(grep -c '^\[\[allowlists\]\]' .gitleaks.toml || true)"
          } >> "$GITHUB_OUTPUT"

  # ---------------------------------------------------------------------------
  sca:
    name: SCA (npm audit, OSV-Scanner, SBOM)
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
      security-events: write
    outputs:
      lockfile: ${{ steps.lockfile.outcome }}
      audit_total: ${{ steps.metricas.outputs.audit_total }}
      audit_altas: ${{ steps.metricas.outputs.audit_altas }}
      dependencias: ${{ steps.metricas.outputs.dependencias }}
      osv: ${{ steps.metricas.outputs.osv }}
      aceptadas: ${{ steps.metricas.outputs.aceptadas }}
      vence: ${{ steps.metricas.outputs.vence }}
      sbom: ${{ steps.metricas.outputs.sbom }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - name: Integridad del lockfile (solo registro npm, solo HTTPS)
        id: lockfile
        run: npx --yes lockfile-lint@4 --path package-lock.json --type npm --allowed-hosts npm --validate-https
      - run: npm ci --ignore-scripts
      # --omit=optional: better-auth declara vitest como peer OPCIONAL y npm audit lo contaría como
      # producción. Las dependencias opcionales/de desarrollo las sigue cubriendo OSV-Scanner (lockfile completo).
      - name: npm audit (dependencias de producción, falla en HIGH/CRITICAL)
        run: npm audit --omit=dev --omit=optional --audit-level=high
      - name: OSV-Scanner (base OSV.dev / GHSA)
        id: osv
        run: |
          set +e
          docker run --rm -v "$PWD:/src" ghcr.io/google/osv-scanner:v2.2.2@sha256:fd62daecbaaed24442031574540e8af6dbaf0ab0a3e28c626bec0dd235a28346 \
            scan source --config /src/osv-scanner.toml --lockfile /src/package-lock.json --format sarif --output /src/osv.sarif
          echo "rc=$?" >> "$GITHUB_OUTPUT"
      - name: Publicar SARIF OSV
        if: always() && hashFiles('osv.sarif') != ''
        uses: github/codeql-action/upload-sarif@9418214df1f2c4b8128c770156c409013b07d6b9 # v3.39.3
        with:
          sarif_file: osv.sarif
          category: osv-scanner
      - name: Gate OSV (falla si hay vulnerabilidades no aceptadas en osv-scanner.toml)
        run: |
          rc="${{ steps.osv.outputs.rc }}"
          if [ "$rc" != "0" ]; then echo "OSV-Scanner encontró vulnerabilidades (código $rc)"; exit 1; fi
      - name: SBOM CycloneDX
        run: npx --yes @cyclonedx/cyclonedx-npm@4 --omit dev --output-file sbom.cdx.json
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: sbom
          path: sbom.cdx.json
      - name: Métricas para el resumen
        id: metricas
        if: always()
        run: |
          npm audit --omit=dev --omit=optional --json > audit.json 2>/dev/null || true
          {
            echo "audit_total=$(jq -r '.metadata.vulnerabilities.total // "?"' audit.json 2>/dev/null || echo '?')"
            echo "audit_altas=$(jq -r '(.metadata.vulnerabilities.high // 0) + (.metadata.vulnerabilities.critical // 0)' audit.json 2>/dev/null || echo '?')"
            echo "dependencias=$(jq -r '.metadata.dependencies.prod // "?"' audit.json 2>/dev/null || echo '?')"
            echo "osv=$(jq '[.runs[].results[]?] | length' osv.sarif 2>/dev/null || echo '?')"
            echo "aceptadas=$(grep -c '^\[\[IgnoredVulns\]\]' osv-scanner.toml || true)"
            echo "vence=$(grep -m1 -oE 'ignoreUntil = [0-9-]+' osv-scanner.toml | cut -d' ' -f3)"
            echo "sbom=$(jq '.components | length' sbom.cdx.json 2>/dev/null || echo '?')"
          } >> "$GITHUB_OUTPUT"

  # ---------------------------------------------------------------------------
  iac:
    name: IaC (Checkov - Terraform, Dockerfile, GitHub Actions)
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
      security-events: write
    outputs:
      aprobados: ${{ steps.metricas.outputs.aprobados }}
      fallidos: ${{ steps.metricas.outputs.fallidos }}
      excepciones: ${{ steps.metricas.outputs.excepciones }}
      desglose: ${{ steps.metricas.outputs.desglose }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      # Imagen oficial fijada por digest (la misma del laboratorio) en lugar de checkov-action:
      # una sola corrida produce la salida de consola, el SARIF y el JSON con las cifras.
      # Checkov no tiene framework "docker_compose"; docker-compose.yml lo revisa Trivy config.
      - name: Checkov
        run: |
          docker run --rm -v "$PWD:/src" -w /src \
            bridgecrew/checkov:3.2.495@sha256:4c2c3b67f09867ef2843a03d8ba82adf712eb93ea3584c1708c24ed584f6da17 \
            -d . --framework terraform,dockerfile,github_actions,secrets \
            --skip-path node_modules --config-file security/checkov/.checkov.yaml \
            -o cli -o sarif -o json --output-file-path console,checkov.sarif,checkov.json
      - name: Publicar SARIF
        if: always() && hashFiles('checkov.sarif') != ''
        uses: github/codeql-action/upload-sarif@9418214df1f2c4b8128c770156c409013b07d6b9 # v3.39.3
        with:
          sarif_file: checkov.sarif
          category: checkov
      - name: Métricas para el resumen
        id: metricas
        if: always()
        run: |
          r='if type=="array" then .[] else . end | select(.summary != null)'
          {
            echo "aprobados=$(jq "[$r | .summary.passed] | add // 0" checkov.json 2>/dev/null || echo '?')"
            echo "fallidos=$(jq "[$r | .summary.failed] | add // 0" checkov.json 2>/dev/null || echo '?')"
            echo "excepciones=$(jq "[$r | .summary.skipped] | add // 0" checkov.json 2>/dev/null || echo '?')"
            echo "desglose=$(jq -r "[$r | \"\(.check_type): \(.summary.passed)\"] | join(\", \")" checkov.json 2>/dev/null || echo '')"
          } >> "$GITHUB_OUTPUT"

  # ---------------------------------------------------------------------------
  container:
    name: Escaneo de imagen (Trivy)
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    needs: [build-test]
    permissions:
      contents: read
      security-events: write
    outputs:
      app_criticas: ${{ steps.metricas.outputs.app_criticas }}
      app_altas: ${{ steps.metricas.outputs.app_altas }}
      app_medias: ${{ steps.metricas.outputs.app_medias }}
      waf_criticas: ${{ steps.metricas.outputs.waf_criticas }}
      waf_altas: ${{ steps.metricas.outputs.waf_altas }}
      sbom: ${{ steps.metricas.outputs.sbom }}
      base: ${{ steps.metricas.outputs.base }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - name: Build imagen
        run: docker build --target runner -t "$IMAGE_NAME:$GITHUB_SHA" .
      # Trivy se ejecuta desde su imagen oficial fijada por digest (la misma de docs/LABORATORIOS.md)
      # en lugar de trivy-action, que descarga el binario en tiempo de ejecución.
      - name: Trivy (SARIF para GitHub Security)
        run: |
          trivy() {
            docker run --rm -v /var/run/docker.sock:/var/run/docker.sock -v "$PWD:/out" \
              -v trivy-cache:/root/.cache "$TRIVY_IMAGE" "$@"
          }
          trivy image --quiet --format sarif --output /out/trivy.sarif \
            --severity CRITICAL,HIGH,MEDIUM --ignore-unfixed "$IMAGE_NAME:$GITHUB_SHA"
        env:
          TRIVY_IMAGE: aquasec/trivy:0.67.2@sha256:e2b22eac59c02003d8749f5b8d9bd073b62e30fefaef5b7c8371204e0a4b0c08
      - name: Publicar SARIF
        if: always() && hashFiles('trivy.sarif') != ''
        uses: github/codeql-action/upload-sarif@9418214df1f2c4b8128c770156c409013b07d6b9 # v3.39.3
        with:
          sarif_file: trivy.sarif
          category: trivy
      - name: SBOM de la imagen (CycloneDX, incluye paquetes del SO base)
        run: |
          docker run --rm -v /var/run/docker.sock:/var/run/docker.sock -v "$PWD:/out" \
            -v trivy-cache:/root/.cache "$TRIVY_IMAGE" \
            image --quiet --format cyclonedx --output /out/sbom-imagen.cdx.json "$IMAGE_NAME:$GITHUB_SHA"
        env:
          TRIVY_IMAGE: aquasec/trivy:0.67.2@sha256:e2b22eac59c02003d8749f5b8d9bd073b62e30fefaef5b7c8371204e0a4b0c08
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: sbom-imagen
          path: sbom-imagen.cdx.json
      - name: Trivy gate (falla en CRITICAL/HIGH con parche disponible)
        run: |
          docker run --rm -v /var/run/docker.sock:/var/run/docker.sock \
            -v trivy-cache:/root/.cache "$TRIVY_IMAGE" \
            image --quiet --exit-code 1 --severity CRITICAL,HIGH --ignore-unfixed \
            --scanners vuln,secret,misconfig "$IMAGE_NAME:$GITHUB_SHA"
        env:
          TRIVY_IMAGE: aquasec/trivy:0.67.2@sha256:e2b22eac59c02003d8749f5b8d9bd073b62e30fefaef5b7c8371204e0a4b0c08
      # El WAF también es una imagen propia (CRS + módulo OpenTelemetry de nginx.org): mismo gate.
      - name: Build imagen del WAF
        run: docker build -t ventas-waf:${{ github.sha }} infra/waf
      - name: Trivy gate del WAF (CRITICAL/HIGH con parche disponible)
        run: |
          docker run --rm -v /var/run/docker.sock:/var/run/docker.sock \
            -v trivy-cache:/root/.cache "$TRIVY_IMAGE" \
            image --quiet --exit-code 1 --severity CRITICAL,HIGH --ignore-unfixed \
            --scanners vuln,secret "ventas-waf:$GITHUB_SHA"
        env:
          TRIVY_IMAGE: aquasec/trivy:0.67.2@sha256:e2b22eac59c02003d8749f5b8d9bd073b62e30fefaef5b7c8371204e0a4b0c08
      - name: Métricas para el resumen
        id: metricas
        if: always()
        run: |
          contar() { # imagen severidad -> vulnerabilidades con parche disponible
            jq "[.Results[]?.Vulnerabilities[]? | select(.Severity==\"$2\")] | length" "$1" 2>/dev/null || echo '?'
          }
          for img in "$IMAGE_NAME" ventas-waf; do
            docker run --rm -v /var/run/docker.sock:/var/run/docker.sock -v "$PWD:/out" -v trivy-cache:/root/.cache "$TRIVY_IMAGE" \
              image --quiet --format json --output "/out/trivy-$img.json" --severity CRITICAL,HIGH,MEDIUM --ignore-unfixed \
              "$img:$GITHUB_SHA" || true
          done
          {
            echo "app_criticas=$(contar "trivy-$IMAGE_NAME.json" CRITICAL)"
            echo "app_altas=$(contar "trivy-$IMAGE_NAME.json" HIGH)"
            echo "app_medias=$(contar "trivy-$IMAGE_NAME.json" MEDIUM)"
            echo "waf_criticas=$(contar trivy-ventas-waf.json CRITICAL)"
            echo "waf_altas=$(contar trivy-ventas-waf.json HIGH)"
            echo "sbom=$(jq '.components | length' sbom-imagen.cdx.json 2>/dev/null || echo '?')"
            echo "base=$(jq -r '.Metadata.OS | "\(.Family) \(.Name)"' "trivy-$IMAGE_NAME.json" 2>/dev/null || echo '?')"
          } >> "$GITHUB_OUTPUT"
        env:
          TRIVY_IMAGE: aquasec/trivy:0.67.2@sha256:e2b22eac59c02003d8749f5b8d9bd073b62e30fefaef5b7c8371204e0a4b0c08

  # ---------------------------------------------------------------------------
  # Pruebas E2E de seguridad (caja gris) contra la app directa, SIN el WAF:
  # detrás del WAF los límites de tasa por IP se activarían con los muchos logins de la suite.
  e2e:
    name: E2E de seguridad (Playwright)
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    outputs:
      aprobadas: ${{ steps.metricas.outputs.aprobadas }}
      fallidas: ${{ steps.metricas.outputs.fallidas }}
      inestables: ${{ steps.metricas.outputs.inestables }}
      duracion: ${{ steps.metricas.outputs.duracion }}
    needs: [build-test]
    services:
      mysql:
        image: mysql:8.4@sha256:a81d043930e51745522bd5c430961cf8286f0a23f0a9a2a6e0108f7ea71b0902
        env:
          MYSQL_DATABASE: ventas_segura
          # Contraseña de root efímera: la BD solo existe en este runner y se destruye al terminar.
          MYSQL_ROOT_PASSWORD: ${{ github.run_id }}-${{ github.run_attempt }}-raiz
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 --silent"
          --health-interval=5s --health-timeout=5s --health-retries=30
    env:
      ROOT_PW: ${{ github.run_id }}-${{ github.run_attempt }}-raiz
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - name: Usuarios de BD con mínimo privilegio y .env.local efímero
        run: |
          rnd() { openssl rand -base64 32; }
          APP_PW=$(openssl rand -hex 24); MIG_PW=$(openssl rand -hex 24)
          echo "::add-mask::$APP_PW"; echo "::add-mask::$MIG_PW"
          mysql -h 127.0.0.1 -uroot -p"$ROOT_PW" <<SQL
          CREATE USER 'ventas_app'@'%' IDENTIFIED BY '${APP_PW}';
          GRANT SELECT, INSERT, UPDATE, DELETE ON ventas_segura.* TO 'ventas_app'@'%';
          CREATE USER 'ventas_migrator'@'%' IDENTIFIED BY '${MIG_PW}';
          GRANT SELECT, INSERT, UPDATE, DELETE, CREATE, ALTER, DROP, INDEX, REFERENCES ON ventas_segura.* TO 'ventas_migrator'@'%';
          FLUSH PRIVILEGES;
          SQL
          cat > .env.local <<ENV
          DATABASE_URL=mysql://ventas_app:${APP_PW}@127.0.0.1:3306/ventas_segura
          MIGRATOR_DATABASE_URL=mysql://ventas_migrator:${MIG_PW}@127.0.0.1:3306/ventas_segura
          APP_URL=http://localhost:3000
          BETTER_AUTH_SECRET=$(rnd)
          FIELD_ENCRYPTION_KEY=$(rnd)
          HMAC_KEY=$(rnd)
          PAYMENT_MODE=simulado
          ALLOW_SIMULATED_PAYMENTS=true
          TRUST_PROXY=true
          PASSWORD_BREACH_CHECK=false
          MAIL_CAPTURE_DIR=./reportes/correos
          UPLOAD_DIR=./uploads
          ENV
          sed -i 's/^ *//' .env.local
      - run: npm ci --ignore-scripts
      - name: Migraciones y datos de ejemplo
        run: |
          npm run db:migrate:local
          npm run db:seed
      - name: Build
        run: npm run build
        env:
          NEXT_TELEMETRY_DISABLED: "1"
      - name: Iniciar la app (producción) y esperar readiness
        run: |
          set -a; . ./.env.local; set +a
          NODE_ENV=production nohup npx next start -p 3000 > app.log 2>&1 &
          for i in $(seq 1 60); do
            curl -fsS "http://localhost:3000/api/health?db=1" && exit 0
            sleep 2
          done
          cat app.log
          exit 1
      - name: Playwright (navegador)
        run: npx playwright install --with-deps chromium
      - name: E2E (login + 2FA, IDOR, control de acceso, CSRF, XSS, checkout, rate limit)
        env:
          E2E_BASE_URL: http://localhost:3000
          E2E_MAILBOX_DIR: ./reportes/correos
          E2E_CREAR_ADMIN: "1"
        run: |
          set +e
          npm run test:e2e 2>&1 | tee e2e.log
          rc=${PIPESTATUS[0]}
          if [ "$rc" != "0" ]; then
            # Resumen de la falla como anotación (visible sin abrir el log completo).
            msg=$(tail -n 40 e2e.log | sed 's/\x1b\[[0-9;]*m//g' | cut -c1-200 | sed ':a;N;$!ba;s/%/%25/g;s/\n/%0A/g')
            echo "::error title=E2E (final del log)::$msg"
          fi
          exit "$rc"
      - name: Log de la app
        if: always()
        run: |
          cat app.log || true
          # Los errores del servidor también como anotaciones (visibles en el resumen del run).
          grep -iE '"level":"(error|fatal)"|error' app.log | head -10 | cut -c1-900 | sed 's/^/::warning title=app.log::/' || true
      - name: Métricas para el resumen
        id: metricas
        if: always()
        run: |
          {
            echo "aprobadas=$(jq '.stats.expected // "?"' e2e-resultados.json 2>/dev/null || echo '?')"
            echo "fallidas=$(jq '.stats.unexpected // "?"' e2e-resultados.json 2>/dev/null || echo '?')"
            echo "inestables=$(jq '.stats.flaky // 0' e2e-resultados.json 2>/dev/null || echo 0)"
            echo "duracion=$(jq '(.stats.duration // 0) / 1000 | floor' e2e-resultados.json 2>/dev/null || echo '?')"
          } >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always()
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          if-no-files-found: ignore

  # ---------------------------------------------------------------------------
  dast:
    name: DAST (OWASP ZAP baseline vía WAF)
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    needs: [container, sast, sca]
    outputs:
      altas: ${{ steps.metricas.outputs.altas }}
      medias: ${{ steps.metricas.outputs.medias }}
      bajas: ${{ steps.metricas.outputs.bajas }}
      informativas: ${{ steps.metricas.outputs.informativas }}
      bloqueos_waf: ${{ steps.metricas.outputs.bloqueos_waf }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - name: Generar .env.docker efímero (secretos aleatorios, sólo CI)
        run: |
          rnd() { openssl rand -base64 32; }
          pw() { openssl rand -hex 24; }
          APP_PW=$(pw); MIG_PW=$(pw)
          cp .env.docker.example .env.docker
          sed -i \
            -e "s|^MYSQL_ROOT_PASSWORD=.*|MYSQL_ROOT_PASSWORD=$(pw)|" \
            -e "s|^APP_DB_PASSWORD=.*|APP_DB_PASSWORD=${APP_PW}|" \
            -e "s|^MIGRATOR_DB_PASSWORD=.*|MIGRATOR_DB_PASSWORD=${MIG_PW}|" \
            -e "s|^DATABASE_URL=.*|DATABASE_URL=mysql://ventas_app:${APP_PW}@db:3306/ventas_segura|" \
            -e "s|^MIGRATOR_DATABASE_URL=.*|MIGRATOR_DATABASE_URL=mysql://ventas_migrator:${MIG_PW}@db:3306/ventas_segura|" \
            -e "s|^BETTER_AUTH_SECRET=.*|BETTER_AUTH_SECRET=$(rnd)|" \
            -e "s|^FIELD_ENCRYPTION_KEY=.*|FIELD_ENCRYPTION_KEY=$(rnd)|" \
            -e "s|^HMAC_KEY=.*|HMAC_KEY=$(rnd)|" \
            -e "s|^PAYMENT_MODE=.*|PAYMENT_MODE=simulado|" \
            -e "s|^ALLOW_SIMULATED_PAYMENTS=.*|ALLOW_SIMULATED_PAYMENTS=true|" \
            .env.docker
      - name: Levantar entorno (waf + app + db)
        run: |
          docker compose up -d db
          docker compose --profile migrate run --rm migrate
          docker compose up -d --build waf app
      - name: Esperar health
        run: |
          for i in $(seq 1 60); do
            curl -fsS http://localhost:8080/api/health && exit 0
            sleep 3
          done
          docker compose logs app waf
          exit 1
      - name: Datos de prueba (catálogo mínimo para que ZAP recorra la tienda)
        run: |
          docker compose exec -T db sh -c 'mysql -uroot -p"$MYSQL_ROOT_PASSWORD" "$MYSQL_DATABASE"' < infra/db/seed-ci.sql
      - name: ZAP baseline (caja negra, pasivo)
        uses: zaproxy/action-baseline@7c4deb10e6261301961c86d65d54a516394f9aed # v0.14.0
        with:
          target: http://localhost:8080
          rules_file_name: security/zap/rules.tsv
          # -I: las WARN aceptadas (justificadas en docs/EVIDENCIA_LABORATORIO.md §5) no rompen el
          # pipeline; solo falla ante una regla marcada FAIL en security/zap/rules.tsv.
          cmd_options: "-a -j -I"
          allow_issue_writing: false
          fail_action: true
          artifact_name: zap-baseline-report
      - name: Logs del WAF (evidencia ModSecurity)
        if: always()
        run: docker compose logs waf > waf.log 2>&1 || true
      - name: Métricas para el resumen
        id: metricas
        if: always()
        run: |
          # Tipos de alerta de ZAP por riesgo (riskcode 3=alto, 2=medio, 1=bajo, 0=informativo).
          riesgo() { jq "[.site[]?.alerts[]? | select(.riskcode==\"$1\")] | length" report_json.json 2>/dev/null || echo '?'; }
          {
            echo "altas=$(riesgo 3)"
            echo "medias=$(riesgo 2)"
            echo "bajas=$(riesgo 1)"
            echo "informativas=$(riesgo 0)"
            echo "bloqueos_waf=$(grep -c 'ModSecurity: Access denied' waf.log 2>/dev/null || true)"
          } >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always()
        with:
          name: waf-logs
          path: waf.log
      - name: Apagar entorno
        if: always()
        run: docker compose down -v

  # ---------------------------------------------------------------------------
  # Resumen legible de TODOS los controles (pestaña "Summary" del run). Corre siempre, también
  # cuando algún control falla, que es cuando más se necesita. No vuelve a analizar nada: solo
  # junta las cifras que publicó cada job. Unos 10 segundos.
  resumen:
    name: Resumen de seguridad
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    if: always()
    needs: [build-test, sast, secrets, sca, iac, container, e2e, dast]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
          sparse-checkout: .github/scripts
      - name: Generar resumen
        env:
          NEEDS: ${{ toJSON(needs) }}
        run: node .github/scripts/resumen-seguridad.mjs
