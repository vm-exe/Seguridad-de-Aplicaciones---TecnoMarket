# =============================================================================
# Exclusiones DESPUÉS del CRS. Usar sólo cuando un falso positivo esté
# documentado en el log de auditoría (MODSEC_AUDIT_LOG) y justificado.
# Formato sugerido:
#   # FP-001: <regla> en <ruta>/<parámetro> - evidencia: <id de transacción>
#   SecRuleUpdateTargetById <id> "!ARGS:<param>"
# =============================================================================

# FP-002: campos internos de Next.js Server Actions (verificado en laboratorio).
#   Evidencia: POST /registro y /login legítimos bloqueados con score 13-28 por
#   942200, 942340 y 942430 sobre ARGS:_1_$ACTION_1:0 = {"id":"<hash>","bound":"$@1"}
#   y ARGS:0 = [{},"$K1"] (JSON que serializa React, no datos del usuario).
#   Riesgo residual: un atacante podría nombrar un campo "$ACTION_x" para evadir
#   la inspección SQLi de ese campo, pero la app ignora esos campos
#   (formAObjeto en src/lib/validation.ts descarta los que empiezan con $ACTION)
#   y todas las consultas son parametrizadas.
SecRuleUpdateTargetByTag "attack-sqli" "!ARGS:/\$ACTION_/"
SecRuleUpdateTargetByTag "attack-injection-generic" "!ARGS:/\$ACTION_/"
SecRuleUpdateTargetByTag "attack-sqli" "!ARGS:0"
SecRuleUpdateTargetByTag "attack-sqli" "!ARGS:1"
SecRuleUpdateTargetByTag "attack-sqli" "!ARGS:2"

# FP-003: contraseñas. Una frase robusta puede contener ' " ; -- u "or" y no debe
#   impedir registrarse ni entrar. Las contraseñas nunca se interpolan en SQL
#   (se hashean con scrypt) ni se muestran en HTML.
SecRuleUpdateTargetByTag "attack-sqli" "!ARGS:/password/"
SecRuleUpdateTargetByTag "attack-injection-generic" "!ARGS:/password/"
SecRuleUpdateTargetByTag "attack-sqli" "!ARGS:/^_?[0-9]*_?actual$/"

# FP-001 (ejemplo): descripciones de productos en el panel admin pueden contener
# texto largo con signos de puntuación que activan 942xxx en PL2.
SecRuleUpdateTargetById 942200 "!ARGS:descripcion"
SecRuleUpdateTargetById 942260 "!ARGS:descripcion"
SecRuleUpdateTargetById 942340 "!ARGS:descripcion"
