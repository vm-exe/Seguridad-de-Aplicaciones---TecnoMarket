# =============================================================================
# Exclusiones ANTES del CRS (afinamiento de falsos positivos) + reglas propias
# Rango de IDs reservado para reglas locales: 1000-99999
# Principio: excluir la mínima regla, para el mínimo parámetro, en la mínima ruta.
# =============================================================================

# --- Next.js Server Actions (falso positivo verificado en laboratorio) ---
# Cada Server Action envía, además de los campos del formulario, campos INTERNOS
# del framework con JSON serializado por React, p. ej.:
#   $ACTION_1:0 / _1_$ACTION_REF_1 = {"id":"<hash>","bound":"$@1"}     0 = [{},"$K1"]
# Ese JSON dispara 942200, 942340 y 942430 (SQLi léxica), y 922130 (nombre de parte
# multipart con "$"), lo que bloqueaba el registro y el login legítimos (score 15-28).
# Exclusión mínima: SOLO esos campos internos y SOLO las familias de reglas que
# disparan. Los campos del usuario (nombres, correo, búsqueda...) se siguen
# inspeccionando. Las exclusiones por nombre de campo con expresión regular están
# en RESPONSE-999 (SecRuleUpdateTargetByTag), porque en libmodsecurity 3.0.17 las
# expresiones regulares dentro de ctl:ruleRemoveTarget* no tienen efecto.
# Aquí solo se desactiva 922130 (nombre de parte multipart con "$") para
# peticiones que realmente son Server Actions.
# Además, una Server Action SIN campos (p. ej. el botón "Pagar") se envía como
# text/plain (cuerpo "[]"), tipo que el CRS no permite (920420). Se agrega
# text/plain SOLO para peticiones con cabecera Next-Action. Esta regla corre antes
# de REQUEST-901, que respeta la variable si ya está definida.
SecRule REQUEST_HEADERS:Next-Action "@rx ^[a-f0-9]{40,64}$" \
    "id:1000,phase:1,pass,nolog,\
    ctl:ruleRemoveById=922130,\
    setvar:'tx.allowed_request_content_type=|application/x-www-form-urlencoded| |multipart/form-data| |multipart/related| |text/xml| |application/xml| |application/soap+xml| |application/json| |text/plain|'"
SecRule ARGS_NAMES "@rx ^_?[0-9]*_?\$ACTION_" \
    "id:1001,phase:2,pass,nolog,\
    ctl:ruleRemoveById=922130"

# --- Contraseñas: no inspeccionar por reglas de inyección SQL "lexical" ---
# Las contraseñas robustas contienen caracteres especiales que generan falsos
# positivos (942xxx). Siguen protegidas por la app (consultas parametrizadas).
SecRule REQUEST_FILENAME "@rx ^/api/auth/(sign-in|sign-up|reset-password|change-password)" \
    "id:1010,phase:1,pass,nolog,\
    ctl:ruleRemoveTargetByTag=attack-sqli;ARGS:json.password,\
    ctl:ruleRemoveTargetByTag=attack-sqli;ARGS:json.newPassword,\
    ctl:ruleRemoveTargetByTag=attack-sqli;ARGS:json.currentPassword"

# --- Regla propia: bloquear escáneres conocidos por User-Agent ---
SecRule REQUEST_HEADERS:User-Agent "@pm sqlmap nikto nessus masscan zgrab" \
    "id:1100,phase:1,deny,status:403,log,\
    msg:'Escaner automatizado bloqueado',tag:'custom/scanner',severity:'CRITICAL'"

# --- Regla propia: el checkout NUNCA acepta precio/total desde el cliente ---
# Defensa en profundidad contra manipulación de precios (caso de abuso AC-05):
# si llega un parámetro "precio", "total" o "amount" en rutas de pago, se bloquea.
SecRule REQUEST_FILENAME "@rx ^/(checkout|api/pagos)" \
    "id:1200,phase:2,chain,deny,status:403,log,\
    msg:'Intento de manipulacion de precio en checkout',tag:'custom/price-tampering',severity:'CRITICAL'"
    SecRule ARGS_NAMES "@rx (?i)(^|\.)(precio|total|amount|price)$" "t:none"

